services:
  - type: web
    name: qr-anketa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DISABLE_TUNNEL
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
