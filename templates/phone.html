{% extends "base.html" %}
{% block title %}Вход по телефону{% endblock %}
{% block content %}
<section class="card login">
  <p class="eyebrow">Анкета</p>
  <h1>Вход по номеру телефона</h1>
  <p class="lead">На номер придёт код подтверждения. Пройти анкету можно только один раз.</p>
  <form method="post" action="{{ url_for('phone_login_post') }}" class="form">
    <label>Номер телефона
      <input class="text-input" type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" value="{{ phone or '' }}" required>
    </label>
    <button class="btn primary wide" type="submit">Получить код</button>
  </form>
</section>
{% endblock %}
